[env:waveshare-esp32-s3-zero]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Waveshare ESP32-S3-Zero has 4 MB flash (devkitc-1 defaults to 8 MB)
; ESP32-S3FH4R2: 4 MB flash + 2 MB quad-SPI PSRAM — must enable or BLE init fails (ESP_ERR_NO_MEM)
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=30

monitor_speed = 115200

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
